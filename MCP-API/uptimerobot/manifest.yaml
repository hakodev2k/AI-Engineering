id: uptimerobot
name: UptimeRobot
upstream:
  - mcp
  - rest
mcp:
  endpoint: https://mcp.uptimerobot.com/mcp
  note: Official remote MCP; delete operations are intentionally not exposed upstream.
api:
  base_url: https://api.uptimerobot.com/v3
auth:
  type: api_key_bearer
  env: UPTIMEROBOT_API_KEY
  least_privilege: Use read-only key for READ-only deployments; Main API key is required for writes.
rate_limits:
  free: 10 requests/minute
  pro: monitor-limit * 2 requests/minute, maximum 5000 requests/minute
  headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After]
capabilities:
  - monitor.list
  - monitor.get
  - monitor.create
  - monitor.update
  - monitor.pause
  - monitor.start
  - monitor.delete
  - incident.list
  - status-page.list
  - maintenance-window.list
risk:
  default: READ
  write_approval: configurable
  destructive: disabled_by_default
required_env:
  - UPTIMEROBOT_API_KEY

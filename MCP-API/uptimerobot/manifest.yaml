id: uptimerobot
name: UptimeRobot
upstream:
  - mcp
  - rest
official_mcp:
  endpoint: https://mcp.uptimerobot.com/mcp
  note: Official remote MCP exists; this connector uses API v3 for stable scoped contracts and destructive controls.
api:
  base_url: https://api.uptimerobot.com/v3
auth:
  type: api_key
  env: UPTIMEROBOT_API_KEY
  least_privilege: read-only key for READ tools; main key only for writes
risk:
  default: READ
  write_approval: configurable
  destructive_approval: required
  destructive_enabled_by_default: false
capabilities:
  - monitor.list
  - monitor.get
  - monitor.create
  - monitor.update
  - monitor.pause
  - monitor.resume
  - monitor.delete
  - incident.list
  - status_page.list
  - maintenance_window.list
required_env:
  - UPTIMEROBOT_API_KEY

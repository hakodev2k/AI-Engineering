id: statsig
name: Statsig
upstream:
  - mcp
  - rest
mcp:
  official: true
  endpoint: https://api.statsig.com/v1/mcp
  transport: streamable-http
  auth: oauth
  note: official authenticated MCP supports project data and read/write workflows; this reusable connector pins a stable allow-listed tool contract and uses Console API fallback for deterministic execution
api:
  type: rest
  base_url: https://statsigapi.net
  version: 20240601
auth:
  type: console_api_key
  header: STATSIG-API-KEY
  credential_env: STATSIG_CONSOLE_API_KEY
capabilities:
  - gate.list
  - gate.get
  - gate.create
  - gate.update
  - experiment.list
  - experiment.get
  - dynamic_config.list
  - dynamic_config.get
  - dynamic_config.create
  - dynamic_config.update
  - metric.list
  - metric_value.list
risk:
  default: READ
  write_requires_approval: true
  destructive_enabled: false
permissions:
  least_privilege: Use a restricted or Personal Console API key whose Statsig role permits only required operations.
rate_limits:
  mutations: approximately 100 requests per 10 seconds and 900 requests per 15 minutes per project
approval:
  read: automatic
  write: requires STATSIG_ALLOW_WRITES=true and matching STATSIG_APPROVAL_TOKEN
environment:
  required:
    - STATSIG_CONSOLE_API_KEY
  optional:
    - STATSIG_API_VERSION
    - STATSIG_TIMEOUT_MS
    - STATSIG_MAX_RETRIES
    - STATSIG_ALLOW_WRITES
    - STATSIG_APPROVAL_TOKEN
    - STATSIG_MCP_URL

id: incident-io
name: incident.io
upstream:
  - mcp
  - rest
mcp:
  endpoint: https://mcp.incident.io/mcp
  auth:
    interactive: oauth
    automated: api-key
api:
  base_url: https://api.incident.io
auth:
  type: bearer-api-key
capabilities:
  - incident.list
  - incident.get
  - incident.create
  - incident.update
  - incident.timeline.create
  - severity.list
  - incident_type.list
  - action.list
  - follow_up.list
risk:
  default: read
  write_requires_approval: true
  destructive_enabled: false
environment:
  - INCIDENT_IO_API_KEY
  - INCIDENT_IO_TIMEOUT_MS
  - INCIDENT_IO_MAX_RETRIES
  - INCIDENT_IO_APPROVAL_MODE

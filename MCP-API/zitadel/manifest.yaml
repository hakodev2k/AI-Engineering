id: zitadel
name: ZITADEL
upstream: [rest]
auth:
  type: oauth2-client-credentials-or-service-account-pat
  scope: urn:zitadel:iam:org:project:id:zitadel:aud
capabilities: [user.search, user.get, user.create, user.update, user.deactivate, user.reactivate, organization.search, organization.domains.list, session.get, pat.search]
risk:
  default: READ
  approval_env: ZITADEL_APPROVED_TOOLS
required_env: [ZITADEL_BASE_URL]
optional_env: [ZITADEL_CLIENT_ID, ZITADEL_CLIENT_SECRET, ZITADEL_PAT, ZITADEL_APPROVED_TOOLS, ZITADEL_TIMEOUT_MS]

id: mailgun
name: Mailgun
upstream:
  - mcp
  - rest
auth:
  type: api-key
  required_env: [MAILGUN_API_KEY]
official_mcp:
  available: true
  mode: local
  note: Official Mailgun MCP exists; this connector uses the official REST API for a fixed, auditable tool contract.
api_base_urls:
  us: https://api.mailgun.net
  eu: https://api.eu.mailgun.net
capabilities:
  - domain.list
  - domain.get
  - event.list
  - stats.get
  - suppression.bounce.list
  - suppression.complaint.list
  - mailing_list.list
  - template.list
  - template.get
  - email.send
risk:
  default: READ
  write_approval: required
  destructive: disabled

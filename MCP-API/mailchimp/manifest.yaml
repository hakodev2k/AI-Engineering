id: mailchimp
name: Mailchimp
upstream:
  - rest
  - mcp
api_base_url: https://{server}.api.mailchimp.com/3.0
official_mcp:
  endpoint: https://mandrillapp.com/mcp
  scope: transactional-messaging
  note: Marketing capabilities in this connector use Marketing API v3.0; the official MCP is Transactional Messaging focused.
auth:
  type: api-key-or-oauth2
  required_env:
    - MAILCHIMP_API_TOKEN
    - MAILCHIMP_SERVER_PREFIX
risk:
  default: READ
approval:
  WRITE: configurable
  HIGH_RISK: required
  DESTRUCTIVE: disabled
capabilities:
  - account.read
  - audience.list
  - audience.read
  - contact.list
  - contact.read
  - contact.upsert
  - contact.update
  - contact.tags.read
  - contact.tags.update
  - contact.event.create
  - campaign.list
  - campaign.read
  - campaign.report.read

id: crisp
name: Crisp
upstream:
  - rest
api_base_url: https://api.crisp.chat/v1
official_mcp: none_found
auth:
  type: basic-token-keypair
  tiers:
    - website
    - plugin
  env:
    - CRISP_TOKEN_IDENTIFIER
    - CRISP_TOKEN_KEY
required_scopes_for_plugin_tokens:
  - website:settings:read
  - website:conversation:sessions:read
  - website:conversation:initiate:write
  - website:conversation:messages:read
  - website:conversation:messages:write
  - website:people:profiles:read
  - website:people:profiles:write
  - website:operators:read
  - website:availability:read
capabilities:
  - website.settings.get
  - conversation.list
  - conversation.get
  - conversation.create
  - conversation.remove
  - message.list
  - message.send
  - note.create
  - people.list
  - people.get
  - people.create
  - people.update
  - people.remove
  - operator.list
  - operator.get
  - availability.get
  - availability.operators.list
risk:
  default: READ
  write_requires_approval: configurable
  high_risk_requires_approval: true
  destructive_disabled_by_default: true

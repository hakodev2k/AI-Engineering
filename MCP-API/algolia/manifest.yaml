id: algolia
name: Algolia
upstream:
  - mcp
  - rest
official_mcp:
  docsearch_endpoint: https://mcp.algolia.com/1/docsearch/mcp
api_base_url: https://{applicationId}-dsn.algolia.net
auth:
  type: api-key
  env: [ALGOLIA_APPLICATION_ID, ALGOLIA_API_KEY]
capabilities:
  - index.search
  - object.get
  - object.save
  - object.partial_update
  - object.delete
  - settings.get
  - settings.update
risk:
  default: read
  write_requires_approval: true
  destructive_disabled_by_default: true
env:
  ALGOLIA_APPLICATION_ID: required
  ALGOLIA_API_KEY: required
  ALGOLIA_ALLOW_WRITE: optional
  ALGOLIA_ALLOW_DESTRUCTIVE: optional
  ALGOLIA_REQUEST_TIMEOUT_MS: optional

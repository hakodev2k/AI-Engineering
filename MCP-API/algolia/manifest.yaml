id: algolia
name: Algolia
upstream:
  - mcp
  - rest
auth:
  mcp: oauth2-bearer
  rest: api-key
mcp:
  endpoint: https://mcp.algolia.com/mcp
  mode: productivity-read
api:
  base_url: https://{ALGOLIA_APP_ID}.algolia.net
capabilities:
  - application.list
  - index.list
  - index.settings.get
  - record.search
  - analytics.top_searches
  - analytics.no_results_rate
  - record.create
  - record.partial_update
risk:
  default: read
  write_requires_approval: true
environment:
  - ALGOLIA_APP_ID
  - ALGOLIA_API_KEY
  - ALGOLIA_MCP_ACCESS_TOKEN
  - ALGOLIA_MCP_URL
  - ALGOLIA_WRITE_ENABLED
  - ALGOLIA_REQUEST_TIMEOUT_MS
security:
  credentials_exposed_to_model: false
  destructive_tools_enabled: false

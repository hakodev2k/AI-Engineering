id: convertkit
name: Kit (formerly ConvertKit)
upstream:
  - mcp
  - rest
mcp:
  endpoint: https://app.kit.com/mcp
  auth: oauth2
api:
  base_url: https://api.kit.com/v4
auth:
  type: api_key_or_oauth2
  env:
    - KIT_API_KEY
    - KIT_OAUTH_ACCESS_TOKEN
capabilities:
  - subscriber.list
  - subscriber.get
  - subscriber.stats
  - subscriber.create
  - subscriber.update
  - subscriber.unsubscribe
  - tag.list
  - tag.subscriber
  - broadcast.list
  - broadcast.get
  - broadcast.stats
  - broadcast.clicks
  - sequence.list
risk:
  default: read
  write_approval: true
  destructive_disabled_by_default: true
notes:
  - Official Kit MCP exists and is recommended for interactive OAuth clients; this reusable headless connector uses official API v4 for deterministic scoped execution.
  - Kit MCP sensitive/open-world actions can require an additional in-app confirmation.

id: imgix
name: Imgix
upstream:
  - rest
api_base_url: https://api.imgix.com/api/v1
auth:
  type: bearer_api_key
  env: IMGIX_API_KEY
  permissions:
    - Sources
    - Analytics
    - Asset Manager Browse
    - Asset Manager Edit
    - Purge
risk:
  default: read
approval:
  write: required
  high_risk: required
capabilities:
  - source.list
  - source.get
  - asset.list
  - asset.get
  - asset.metadata.update
  - asset.add_from_origin
  - asset.refresh
  - cache.purge
  - report.list
  - report.get
environment:
  - IMGIX_API_KEY
  - IMGIX_ALLOW_WRITE
  - IMGIX_ALLOW_HIGH_RISK
  - IMGIX_APPROVAL_SECRET
  - IMGIX_TIMEOUT_MS
  - IMGIX_MAX_READ_RETRIES

id: sentry
name: Sentry
upstream: [rest]
api_base_url: https://sentry.io/api/0
auth:
  type: bearer-token
  env: SENTRY_AUTH_TOKEN
  recommended: organization-auth-token
scopes:
  read: [org:read, project:read, event:read]
  write: [project:write]
risk:
  default: READ
  write_requires_approval: true
capabilities:
  - organization.list
  - project.list
  - issue.list
  - issue.get
  - event.list
  - event.get
  - release.list
  - team.list
  - member.list
  - issue.update
  - issue.delete
required_environment: [SENTRY_AUTH_TOKEN]

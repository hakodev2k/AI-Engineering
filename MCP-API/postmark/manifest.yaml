id: postmark
name: Postmark
upstream:
  - rest
auth:
  type: server-token
  header: X-Postmark-Server-Token
  scopes: []
api:
  base_url: https://api.postmarkapp.com
mcp:
  official_server: false
capabilities:
  - message.send
  - message.send_template
  - message.outbound.list
  - message.outbound.get
  - bounce.list
  - bounce.get
  - template.list
  - template.get
  - message_stream.list
  - message_stream.get
  - webhook.list
  - webhook.get
  - webhook.statistics
  - suppression.list
  - suppression.create
risk:
  default: READ
  approval:
    WRITE: configurable
    HIGH_RISK: required
environment:
  required: [POSTMARK_SERVER_TOKEN]
  optional: [POSTMARK_API_BASE_URL, POSTMARK_TIMEOUT_MS, POSTMARK_MAX_RETRIES, POSTMARK_REQUIRE_WRITE_APPROVAL]

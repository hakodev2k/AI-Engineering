id: postmark
name: Postmark
upstream:
  - rest
auth:
  type: server-token
  header: X-Postmark-Server-Token
  required_env:
    - POSTMARK_SERVER_TOKEN
api_base_url: https://api.postmarkapp.com
official_mcp: none-required-by-this-connector
capabilities:
  - server.get
  - template.list
  - template.get
  - message.outbound.list
  - message.outbound.get
  - bounce.list
  - bounce.get
  - webhook.list
  - webhook.get
  - webhook.statistics
  - email.send
  - email.send_template
risk:
  default: READ
  write_approval: required
  destructive: disabled

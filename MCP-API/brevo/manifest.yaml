id: brevo
name: Brevo
version: 1.0.0
upstream:
  - mcp
  - rest
transport_strategy:
  official_mcp:
    available: true
    endpoint: https://mcp.brevo.com/v1/brevo/mcp
    note: "Official MCP exists with 27 modules and full read/write token access. This connector intentionally uses scoped REST handlers for the implemented tools so permission boundaries, strict schemas, retry rules, and approval gates are locally enforceable."
  implemented: rest
auth:
  type: api_key
  header: api-key
  env: BREVO_API_KEY
api:
  base_url: https://api.brevo.com/v3
capabilities:
  - account.read
  - contact.list
  - contact.read
  - contact.create
  - contact.update
  - contact.delete
  - campaign.list
  - campaign.read
  - campaign.create
  - campaign.send
  - transactional_email.send
  - sender.list
  - webhook.list
  - webhook.create
  - webhook.delete
risk:
  default: READ
  approval_env:
    WRITE: BREVO_ALLOW_WRITE
    HIGH_RISK: BREVO_ALLOW_HIGH_RISK
    DESTRUCTIVE: BREVO_ALLOW_DESTRUCTIVE
required_environment:
  - BREVO_API_KEY
optional_environment:
  - BREVO_TIMEOUT_MS
  - BREVO_MAX_RETRIES
  - BREVO_ALLOW_WRITE
  - BREVO_ALLOW_HIGH_RISK
  - BREVO_ALLOW_DESTRUCTIVE
security:
  credentials_exposed_to_llm: false
  arbitrary_http_tool: false
  webhook_https_only: true
  provider_content_untrusted: true

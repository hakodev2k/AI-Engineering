id: brevo
name: Brevo
version: 1.0.0

upstream:
  - official-mcp
  - rest

transport_strategy:
  selected: rest
  official_mcp:
    endpoint: https://mcp.brevo.com/v1/brevo/mcp
    auth: bearer_mcp_token
    note: Official MCP exists and exposes a broad auto-generated tool surface. This connector intentionally uses the official REST API for a smaller, stable, approval-gated contract suitable for non-interactive reusable agents.
  rest:
    base_url_env: BREVO_API_URL
    default_base_url: https://api.brevo.com
    version: v3

auth:
  type: api_key
  header: api-key
  credential_env: BREVO_API_KEY
  credential_isolation: connector-only

capabilities:
  - account.get
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - contact_list.list
  - campaign.list
  - campaign.get
  - campaign.create
  - campaign.send
  - transactional_email.send
  - webhook.list
  - webhook.create
  - webhook.delete

risk:
  default: READ
  write_requires_approval: true
  high_risk_requires_approval: true
  destructive_disabled_by_default: true

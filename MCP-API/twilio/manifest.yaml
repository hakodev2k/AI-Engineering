id: twilio
name: Twilio
runtime: node>=20

upstream:
  - mcp
  - sdk

mcp:
  endpoint: https://mcp.twilio.com/docs
  auth: none
  tools:
    - twilio__search
    - twilio__retrieve
  mode: read_only_documentation

api:
  base_url: https://api.twilio.com/2010-04-01
  sdk: twilio-node

auth:
  type: api_key_basic
  recommended_key_type: restricted_or_standard_api_key
  credential_isolation: true
  env:
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY
    - TWILIO_API_SECRET
    - TWILIO_ALLOWED_FROM_NUMBERS
    - TWILIO_APPROVAL_SECRET

capabilities:
  - api.search
  - api.retrieve
  - account.read
  - message.list
  - message.read
  - message.send
  - call.list
  - call.read
  - call.create
  - phone_number.list
  - phone_number.read

risk:
  default: READ
  HIGH_RISK:
    - twilio.message.send
    - twilio.call.create
  approval_required:
    - twilio.message.send
    - twilio.call.create

reliability:
  read_429_retry: bounded_exponential_backoff
  write_retry: disabled
  timeout_env: TWILIO_TIMEOUT_MS

security:
  outbound_sender_allowlist: TWILIO_ALLOWED_FROM_NUMBERS
  approval: action_and_target_bound_hmac_5m
  provider_content_untrusted: true
  arbitrary_api_passthrough: false

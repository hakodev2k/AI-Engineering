id: stripe
name: Stripe
upstream:
  - rest
auth:
  type: api-key
  credential_env: STRIPE_SECRET_KEY
api:
  base_url: https://api.stripe.com/v1
  version_env: STRIPE_API_VERSION
capabilities:
  - customer.list
  - customer.get
  - customer.search
  - customer.create
  - customer.update
  - product.list
  - price.list
  - payment_intent.list
  - payment_intent.get
  - invoice.list
  - invoice.get
  - payment_link.create
  - refund.create
  - event.list
risk:
  default: READ
  write_requires_approval: configurable
  high_risk_requires_approval: true
env:
  - STRIPE_SECRET_KEY
  - STRIPE_API_VERSION
  - STRIPE_TIMEOUT_MS
  - STRIPE_MAX_RETRIES
  - STRIPE_REQUIRE_WRITE_APPROVAL
  - STRIPE_APPROVED_ACTION_IDS

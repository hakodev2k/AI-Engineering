id: customer-io
name: Customer.io
upstream:
  - mcp
  - rest
official_mcp:
  transport: http
  us_endpoint: https://mcp.customer.io/mcp
  eu_endpoint: https://mcp-eu.customer.io/mcp
  auth: oauth
  scopes: [read, read:sensitive, write, write:live, configure]
api:
  name: App API
  us_base_url: https://api.customer.io
  eu_base_url: https://api-eu.customer.io
  auth: bearer_app_api_key
auth:
  type: api_key
  required_env: [CUSTOMERIO_APP_API_KEY]
capabilities:
  - profile.search
  - profile.attributes.read
  - profile.segments.read
  - profile.messages.read
  - segment.list
  - segment.read
  - segment.members.read
  - segment.create_manual
  - automation.list
  - automation.read
  - automation.actions.read
  - newsletter.list
  - transactional.email.send
  - reporting_webhook.list
  - reporting_webhook.create
  - reporting_webhook.delete
risk:
  default: READ
  write_approval: configurable
  high_risk_approval: required
  destructive_enabled: false
security:
  credentials_exposed_to_agent: false
  retrieved_content_is_untrusted: true

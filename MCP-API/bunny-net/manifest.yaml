id: bunny-net
name: bunny.net
version: 1.0.0
runtime: node>=20
upstream:
  - rest
official_mcp:
  available: false
api:
  base_url: https://api.bunny.net
  docs: https://docs.bunny.net/reference/bunnynet-api-overview
auth:
  type: api-key
  header: AccessKey
  env:
    - BUNNY_API_KEY
capabilities:
  - pull_zone.list
  - pull_zone.get
  - storage_zone.list
  - storage_zone.get
  - dns_zone.list
  - dns_zone.get
  - dns_zone.export
  - pull_zone.allowed_referrer.add
  - pull_zone.blocked_ip.remove
  - dns_record.add
  - pull_zone.delete
risk:
  default: READ
  write_requires_approval: true
  high_risk_requires_approval: true
  destructive_disabled_by_default: true
environment:
  required:
    - BUNNY_API_KEY
  optional:
    - BUNNY_API_BASE_URL
    - BUNNY_TIMEOUT_MS
    - BUNNY_MAX_RETRIES
    - BUNNY_ALLOW_WRITE
    - BUNNY_ALLOW_HIGH_RISK
    - BUNNY_ALLOW_DESTRUCTIVE
security:
  credential_isolation: true
  ssrf_origin_lock: true
  bounded_retries: true
  retrieved_content_untrusted: true

id: canva
name: Canva
upstream:
  - rest
official_mcp:
  available: true
  endpoint: https://mcp.canva.com/mcp
  transport: remote_mcp
  integration_status: "Checked; Canva requires per-user authentication and currently controls third-party AI product access/allowlisting. This package therefore uses the official Connect REST API for its stable executable tool contracts instead of impersonating or bypassing the MCP OAuth flow."
rest:
  base_url: https://api.canva.com/rest/v1
auth:
  type: oauth2_authorization_code_pkce
  token_endpoint: https://api.canva.com/rest/v1/oauth/token
  supported_credentials:
    - access_token
    - rotating_refresh_token_with_client_credentials
  token_cache: "Optional local secret cache with mode 0600 for rotated one-time refresh tokens."
  scopes:
    - profile:read
    - design:meta:read
    - design:content:read
    - design:content:write
    - asset:read
    - asset:write
environment:
  required_one_of:
    - [CANVA_ACCESS_TOKEN]
    - [CANVA_REFRESH_TOKEN, CANVA_CLIENT_ID, CANVA_CLIENT_SECRET]
    - [CANVA_TOKEN_CACHE_FILE, CANVA_CLIENT_ID, CANVA_CLIENT_SECRET]
  optional:
    - CANVA_API_BASE_URL
    - CANVA_MCP_URL
    - CANVA_TIMEOUT_MS
    - CANVA_MAX_RETRIES
    - CANVA_REQUIRE_WRITE_APPROVAL
    - CANVA_APPROVED_ACTIONS
capabilities:
  - user.profile.get
  - user.capabilities.get
  - design.list
  - design.get
  - design.pages.list
  - design.export_formats.list
  - design.dataset.get
  - asset.get
  - asset.upload_job.get
  - asset.url_upload_job.get
  - design.export_job.get
  - design.resize_job.get
  - design.create
  - asset.url_upload.create
  - design.export.create
  - design.resize.create
risk:
  default: READ
  write_requires_approval_by_default: true
  high_risk_requires_explicit_approval: true
  destructive_tools: false

id: clerk
name: Clerk
upstream:
  - rest
official_mcp:
  available: true
  purpose: "Clerk's beta remote MCP server provides current SDK snippets and implementation patterns; it is not used for tenant administration in this connector."
api_base_url: https://api.clerk.com/v1
auth:
  type: bearer_secret_key
  environment:
    - CLERK_SECRET_KEY
capabilities:
  - user.list
  - user.read
  - user.update
  - organization.list
  - organization.read
  - organization.update
  - organization.membership.list
  - organization.invitation.list
  - organization.invitation.create
  - session.list
  - session.read
  - session.revoke
  - invitation.create
risk:
  default: READ
  write_approval: required
  high_risk_approval: required
  destructive_enabled: false
required_environment:
  - CLERK_SECRET_KEY
optional_environment:
  - CLERK_API_BASE_URL
  - CLERK_API_VERSION
  - CLERK_READ_ONLY
  - CLERK_ALLOW_WRITE
  - CLERK_APPROVAL_MODE
  - CLERK_TIMEOUT_MS
  - CLERK_MAX_RETRIES
security:
  credentials_exposed_to_agent: false
  arbitrary_http_requests: false
  retrieved_content_is_untrusted: true

id: bitwarden
name: Bitwarden
upstream:
  - rest
official_mcp: false
api:
  base_url_env: BITWARDEN_API_URL
  default_base_url: https://api.bitwarden.com
  public_api_prefix: /public
auth:
  type: oauth2_client_credentials
  token_url_env: BITWARDEN_IDENTITY_URL
  scope: api.organization
  environment:
    - BITWARDEN_CLIENT_ID
    - BITWARDEN_CLIENT_SECRET
capabilities:
  - member.list
  - member.get
  - group.list
  - group.get
  - collection.list
  - collection.get
  - policy.list
  - policy.get
  - event.list
risk:
  default: READ
  writes_exposed: false
approval:
  required: false
notes:
  - Organization Public API only; individual vault items and secret values are intentionally not exposed.
  - Organization API credentials grant broad organization access and remain isolated in the connector.

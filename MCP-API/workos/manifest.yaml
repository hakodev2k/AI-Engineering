id: workos
name: WorkOS
version: 1.0.0
upstream:
  mcp:
    endpoint: https://mcp.workos.com/mcp
    status: official
    transport: streamable-http
    auth: oauth2
    note: Official management MCP exposes whoami, list_operations, query, and mutate. This connector uses the official REST API for deterministic headless API-key execution; MCP remains the preferred interactive management surface.
  rest:
    endpoint: https://api.workos.com
    status: primary-connector-transport
auth:
  type: api_key
  header: Authorization
  scheme: Bearer
  environment:
    - WORKOS_API_KEY
capabilities:
  - organization.list
  - organization.read
  - directory.list
  - directory.read
  - directory_user.list
  - directory_user.read
  - directory_group.list
  - directory_group.read
  - event.list
  - audit_event.create
risk:
  default: READ
  write_tools:
    - workos.audit_event.create
  destructive_tools: []
approval:
  writes: required
  destructive: disabled
rate_limits:
  general: 6000 requests/60_seconds/api_key
  directory_users: 4 requests/second/directory
required_environment:
  - WORKOS_API_KEY
optional_environment:
  - WORKOS_API_BASE_URL
  - WORKOS_TIMEOUT_MS
  - WORKOS_MAX_RETRIES
  - WORKOS_WRITE_APPROVED
security:
  arbitrary_api_tool: false
  credential_exposure_to_llm: false
  provider_content_is_untrusted: true

id: statuspage
name: Atlassian Statuspage
upstream:
  - rest
auth:
  type: api_key
  header: "Authorization: OAuth <token>"
api_base_url: https://api.statuspage.io/v1
mcp:
  official_server: false
capabilities:
  - page.read
  - component.list
  - component.read
  - component.update
  - incident.list
  - incident.read
  - incident.create
  - incident.update
  - incident.resolve
  - maintenance.create
risk:
  default: READ
  writes_require_approval: true
env:
  - STATUSPAGE_API_KEY
  - STATUSPAGE_PAGE_ID
  - STATUSPAGE_ALLOW_WRITES
  - STATUSPAGE_TIMEOUT_MS
rate_limit:
  policy: "Manage API: 1 request/second over a 60-second rolling window; 420/429 indicate throttling"
security:
  credentials_exposed_to_model: false
  arbitrary_http: false

id: lemonsqueezy
name: Lemon Squeezy
upstream:
  - rest
api_base_url: https://api.lemonsqueezy.com
official_mcp: none-found-as-of-2026-09-09
auth:
  type: bearer-api-key
  env: LEMONSQUEEZY_API_KEY
capabilities:
  - store.list
  - store.get
  - product.list
  - product.get
  - variant.list
  - variant.get
  - customer.list
  - customer.get
  - customer.create
  - order.list
  - order.get
  - subscription.list
  - subscription.get
  - subscription.update
  - subscription.cancel
  - discount.list
  - discount.create
  - discount.delete
  - license_key.list
  - checkout.create
risk:
  default: READ
  write_requires_approval: true
  destructive_disabled_by_default: true
rate_limit: 300 requests/minute
required_env:
  - LEMONSQUEEZY_API_KEY

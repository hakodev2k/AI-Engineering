id: auth0
name: Auth0
runtime: nodejs-20
upstream:
  - rest
official_sources:
  management_api: https://auth0.com/docs/api/management/v2
  node_sdk: https://github.com/auth0/node-auth0
  rate_limits: https://auth0.com/docs/troubleshoot/customer-support/operational-policies/rate-limit-policy
mcp:
  official_server: false
  note: No Auth0-operated MCP server was identified; the connector exposes Auth0 Management API operations as MCP tools.
auth:
  type: oauth2-client-credentials-or-static-management-token
  audience: https://{AUTH0_DOMAIN}/api/v2/
  required_scopes:
    - read:users
    - create:users
    - update:users
    - delete:users
    - read:clients
    - read:connections
    - read:roles
    - read:logs
environment:
  - AUTH0_DOMAIN
  - AUTH0_CLIENT_ID
  - AUTH0_CLIENT_SECRET
  - AUTH0_MANAGEMENT_TOKEN
  - AUTH0_APPROVAL_SECRET
  - AUTH0_TIMEOUT_MS
  - AUTH0_MAX_RETRIES
capabilities:
  - user.search
  - user.get
  - user.create
  - user.update
  - user.delete
  - client.list
  - connection.list
  - role.list
  - log.list
risk:
  default: read
  approval_required:
    - auth0.user.create
    - auth0.user.update
    - auth0.user.delete
  destructive_disabled_without_explicit_approval: true

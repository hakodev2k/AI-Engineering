id: todoist
name: Todoist
upstream:
  - mcp
  - rest
mcp:
  endpoint: https://ai.todoist.net/mcp
  transport: streamable-http
  auth: oauth2-bearer
rest:
  base_url: https://api.todoist.com/api/v1
auth:
  primary:
    type: personal_api_token
    environment: TODOIST_API_TOKEN
    header: "Authorization: Bearer <token>"
  optional_mcp:
    type: oauth2_access_token
    environment: TODOIST_MCP_ACCESS_TOKEN
  oauth_scopes:
    read_only: [data:read]
    read_write: [data:read_write]
    destructive_not_requested: [data:delete, project:delete]
environment:
  required: [TODOIST_API_TOKEN]
  optional: [TODOIST_API_BASE_URL, TODOIST_MCP_URL, TODOIST_MCP_ACCESS_TOKEN, TODOIST_TIMEOUT_MS, TODOIST_MAX_RETRIES, TODOIST_REQUIRE_WRITE_APPROVAL, TODOIST_APPROVED_ACTIONS]
capabilities:
  - task.search
  - task.get
  - task.create
  - task.update
  - task.complete
  - project.list
  - project.get
  - project.create
  - section.list
  - comment.list
  - comment.add
  - activity.list
  - user.get
risk:
  default: READ
  writes_require_approval_by_default: true
  destructive_tools_exposed: false

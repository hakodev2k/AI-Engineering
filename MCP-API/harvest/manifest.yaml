id: harvest
name: Harvest
upstream: [rest]
api_base_url: https://api.harvestapp.com/v2
auth:
  type: oauth2-bearer
  required_headers: [Authorization, Harvest-Account-Id, User-Agent]
environment: [HARVEST_ACCESS_TOKEN, HARVEST_ACCOUNT_ID, HARVEST_USER_AGENT, HARVEST_TIMEOUT_MS, HARVEST_ALLOW_WRITES]
risk:
  default: READ
  writes_require_approval: true
capabilities:
  - users.list
  - clients.list
  - projects.list
  - tasks.list
  - time_entries.list
  - time_entries.get
  - time_entries.create
  - time_entries.update
  - time_entries.stop
  - expenses.list
  - invoices.list
  - reports.time_projects
  - reports.uninvoiced
limits:
  general: 100 requests / 15 seconds
  reports: 100 requests / 15 minutes
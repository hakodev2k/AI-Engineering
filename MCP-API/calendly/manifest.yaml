id: calendly
name: Calendly
upstream:
  - mcp
  - rest
mcp:
  endpoint: https://mcp.calendly.com/
  auth: oauth2.1-dcr-pkce
  scopes: [mcp:scheduling:read, mcp:scheduling:write]
rest:
  base_url: https://api.calendly.com
  auth: oauth2-or-personal-access-token
env:
  required: [CALENDLY_ACCESS_TOKEN]
  optional: [CALENDLY_API_BASE_URL, CALENDLY_TIMEOUT_MS, CALENDLY_MAX_RETRIES, CONNECTOR_ALLOW_WRITES]
capabilities:
  - user.get
  - event_type.list
  - event_type.get
  - event_type.available_times
  - scheduled_event.list
  - scheduled_event.get
  - invitee.list
  - invitee.get
  - scheduling_link.create
  - scheduled_event.cancel
risk:
  default: READ
  write_approval: required
  destructive_approval: required
notes:
  - Official hosted MCP is preferred for compatible clients supporting DCR and OAuth 2.1 PKCE.
  - This reusable stdio bridge uses official REST API v2 so PAT/OAuth bearer credentials can remain isolated server-side.

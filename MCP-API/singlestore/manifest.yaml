id: singlestore
name: SingleStore
upstream:
  official_mcp:
    available: true
    mode: local-stdio
    package: singlestore-mcp-server
    auth: browser-oauth-or-api-key
  rest:
    base_url: https://api.singlestore.com
    auth: bearer-api-key
auth:
  type: api_key
  env: SINGLESTORE_API_KEY
capabilities:
  - region.list
  - workspace_group.list
  - workspace_group.get
  - workspace.list
  - workspace.get
  - workspace.outbound_allowlist.get
  - workspace.suspend
  - workspace.resume
  - workspace.delete
risk:
  default: READ
  writes_require_approval: configurable
  high_risk_requires_approval: true
  destructive_disabled_by_default: true
required_env:
  - SINGLESTORE_API_KEY
security:
  credentials_exposed_to_llm: false
  provider_content_untrusted: true
  arbitrary_http_disabled: true

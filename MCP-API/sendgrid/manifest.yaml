id: sendgrid
name: Twilio SendGrid
upstream: [rest]
api_base_url: https://api.sendgrid.com/v3
auth:
  type: api_key
  env: SENDGRID_API_KEY
  least_privilege: true
capabilities:
  - mail.send
  - template.list
  - template.get
  - contact.search
  - contact.upsert
  - contact.delete
  - list.list
  - list.get
  - suppression.get
  - suppression.delete
risk:
  default: READ
  write_approval_configurable: true
  destructive_disabled_by_default: true
required_env: [SENDGRID_API_KEY]

id: nango
name: Nango
upstream:
  - rest
  - mcp-proxy
auth:
  type: bearer-secret-key
  environment: NANGO_SECRET_KEY
api:
  base_url: https://api.nango.dev
capabilities:
  - provider.list
  - provider.get
  - provider.search
  - integration.list
  - integration.search
  - connect_session.create
  - mcp.initialize
  - mcp.tools.list
  - mcp.tool.call
risk:
  default: READ
  write_approval_configurable: true
  high_risk_approval_required: true
  destructive_enabled_by_default: false
environment:
  - NANGO_SECRET_KEY
  - NANGO_BASE_URL
  - NANGO_TIMEOUT_MS
  - NANGO_MAX_RETRIES
  - NANGO_REQUIRE_WRITE_APPROVAL
  - NANGO_ENABLE_DESTRUCTIVE
  - NANGO_APPROVED_ACTION_IDS

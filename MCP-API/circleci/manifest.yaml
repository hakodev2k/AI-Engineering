id: circleci
name: CircleCI
upstream:
  - mcp
  - rest
mcp:
  hosted_endpoint: https://mcp.circleci.com/v1/mcp
  status: preview
  preferred_for: [diagnostics, logs, workflow-rerun, workflow-cancel]
api:
  base_url: https://circleci.com/api/v2
auth:
  type: oauth2-or-personal-api-token
  env: CIRCLECI_TOKEN
capabilities:
  - pipeline.list
  - pipeline.get
  - pipeline.trigger
  - workflow.get
  - workflow.jobs.list
  - workflow.rerun
  - workflow.cancel
  - workflow.job.approve
  - project.get
  - project.checkout_key.list
risk:
  default: READ
  approval_required: [pipeline.trigger, workflow.rerun, workflow.cancel, workflow.job.approve]
environment:
  required: [CIRCLECI_TOKEN]
  optional: [CIRCLECI_API_BASE_URL, CIRCLECI_TIMEOUT_MS, CIRCLECI_MAX_RETRIES, CIRCLECI_REQUIRE_WRITE_APPROVAL]

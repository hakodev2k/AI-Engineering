id: render
name: Render
upstream:
  - mcp
  - rest
official_mcp:
  endpoint: https://mcp.render.com/mcp
  transport: streamable-http
api:
  base_url: https://api.render.com/v1
auth:
  type: bearer-api-key
  env: RENDER_API_KEY
capabilities:
  - workspace.list
  - service.list
  - service.get
  - deploy.list
  - deploy.get
  - deploy.trigger
  - logs.list
  - metrics.get
  - postgres.list
  - postgres.query_readonly
  - service.suspend
  - service.resume
risk:
  default: READ
  write_requires: RENDER_ALLOW_WRITES
  high_risk_requires: RENDER_ALLOW_HIGH_RISK
environment:
  - RENDER_API_KEY
  - RENDER_MCP_URL
  - RENDER_API_BASE_URL
  - RENDER_TIMEOUT_MS
  - RENDER_MAX_RETRIES
  - RENDER_ALLOW_WRITES
  - RENDER_ALLOW_HIGH_RISK

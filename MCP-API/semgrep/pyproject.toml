[project]
name = "semgrep-mcp-api-connector"
version = "1.0.0"
description = "Policy-enforcing MCP facade for the official Semgrep Guardian MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.13,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[project.scripts]
semgrep-connector = "semgrep_connector.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semgrep_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

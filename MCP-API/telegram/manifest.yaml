id: telegram
name: Telegram
version: 1.0.0
upstream:
  - rest
api:
  base_url: https://api.telegram.org
  official_docs: https://core.telegram.org/bots/api
auth:
  type: bot_token
  environment:
    - TELEGRAM_BOT_TOKEN
credential_isolation: true
capabilities:
  - bot.read_identity
  - update.list
  - chat.read
  - chat.list_administrators
  - chat.read_member_count
  - message.send
  - message.edit
  - message.delete
  - message.send_action
  - message.pin
  - message.unpin
risk:
  default: READ
  tools:
    telegram.bot.get: READ
    telegram.update.list: READ
    telegram.chat.get: READ
    telegram.chat.administrator.list: READ
    telegram.chat.member_count.get: READ
    telegram.message.send: WRITE
    telegram.message.edit: WRITE
    telegram.message.delete: DESTRUCTIVE
    telegram.message.action.send: WRITE
    telegram.message.pin: HIGH_RISK
    telegram.message.unpin: HIGH_RISK
approval:
  WRITE: required
  HIGH_RISK: required
  DESTRUCTIVE: required
configuration:
  - TELEGRAM_ALLOWED_CHAT_IDS
  - TELEGRAM_APPROVAL_IDS
  - TELEGRAM_TIMEOUT_MS
  - TELEGRAM_MAX_READ_RETRIES
notes:
  - Bot tokens stay inside the connector and are never exposed through MCP outputs.
  - Read retries are bounded; non-idempotent writes are not automatically retried.
  - getUpdates cannot be used while an outgoing webhook is active.

id: temporal
name: Temporal
upstream:
  - official-typescript-sdk
auth:
  type: api-key-or-mtls
  env: [TEMPORAL_API_KEY]
connection:
  address_env: TEMPORAL_ADDRESS
  namespace_env: TEMPORAL_NAMESPACE
capabilities:
  - workflow.list
  - workflow.describe
  - workflow.history
  - workflow.query
  - workflow.start
  - workflow.signal
  - workflow.cancel
  - workflow.terminate
  - workflow.signal_with_start
risk:
  default: READ
  writes_require: TEMPORAL_ALLOW_WRITES=true
  high_risk_requires: signed approval
  destructive: disabled
notes:
  official_mcp: "No Temporal-operated MCP server identified in official docs during 2026-09-24 research; connector uses official @temporalio/client SDK."

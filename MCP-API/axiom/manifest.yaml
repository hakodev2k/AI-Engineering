id: axiom
name: Axiom
upstream:
  - mcp
  - rest
mcp:
  remote_endpoint: https://mcp.axiom.co/mcp
  sse_endpoint: https://mcp.axiom.co/sse
  preferred_for:
    - dataset.list
    - dataset.schema
    - query.apl
    - monitor.list
    - monitor.create
    - monitor.update
rest:
  base_url: https://api.axiom.co
  fallback_for:
    - dataset.list
    - dataset.get
    - dataset.schema
    - query.apl
    - monitor.list
    - monitor.get
    - monitor.history
    - monitor.create
    - monitor.update
auth:
  api:
    type: advanced_api_token
    header: "Authorization: Bearer <token>"
    note: "Prefer least-privilege advanced API tokens; PATs have full account control."
  remote_mcp:
    type: oauth2_or_pat
    header_auth_requires: [AXIOM_MCP_PAT, AXIOM_ORG_ID]
permissions:
  guidance:
    - dataset query access for read/query tools
    - monitor read access for monitor reads
    - monitor create/update only for corresponding write tools
capabilities:
  - dataset.list
  - dataset.get
  - dataset.schema
  - query.apl
  - monitor.list
  - monitor.get
  - monitor.history
  - monitor.create
  - monitor.update
risk:
  default: READ
  write_requires_approval_by_default: true
  destructive_tools_exposed: false
environment:
  required: [AXIOM_TOKEN]
  optional: [AXIOM_API_URL, AXIOM_ORG_ID, AXIOM_MCP_URL, AXIOM_MCP_PAT, AXIOM_TIMEOUT_MS, AXIOM_MAX_RETRIES, AXIOM_REQUIRE_WRITE_APPROVAL, AXIOM_ENABLE_DESTRUCTIVE, AXIOM_APPROVED_ACTIONS]

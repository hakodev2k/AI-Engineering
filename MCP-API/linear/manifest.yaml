id: linear
name: Linear
upstream:
  - mcp
  - graphql
official_mcp:
  endpoint: https://mcp.linear.app/mcp
  readonly_endpoint: https://mcp.linear.app/mcp/readonly
api:
  base_url: https://api.linear.app/graphql
auth:
  type: api-key-or-oauth2
  env: [LINEAR_API_KEY]
capabilities:
  - issue.search
  - issue.get
  - issue.create
  - issue.update
  - issue.comment
  - project.list
  - team.list
  - workflow_state.list
risk:
  default: READ
  writes_require_approval: true

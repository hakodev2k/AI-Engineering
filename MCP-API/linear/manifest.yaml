id: linear
name: Linear
upstream:
  - mcp
transport:
  type: streamable-http
  endpoint: https://mcp.linear.app/mcp
  readonly_endpoint: https://mcp.linear.app/mcp/readonly
auth:
  type: bearer-token
  supported:
    - oauth-2.1-access-token
    - linear-api-key
security:
  upstream_tools_allowlisted: true
  credentials_exposed_to_llm: false
  provider_content_untrusted: true
  team_allowlist_supported: true
  project_allowlist_supported: true
capabilities:
  - issue.list
  - issue.get
  - project.list
  - project.get
  - comment.list
  - user.list
  - label.list
  - issue.save
  - project.save
  - document.save
risk:
  default: READ
  WRITE:
    - linear.issue.save
    - linear.project.save
    - linear.document.save
approval:
  write: required
required_environment:
  - LINEAR_ACCESS_TOKEN
  - LINEAR_APPROVAL_SECRET
optional_environment:
  - LINEAR_MCP_URL
  - LINEAR_ALLOWED_TEAM_IDS
  - LINEAR_ALLOWED_PROJECT_IDS

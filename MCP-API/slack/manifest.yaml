id: slack
name: Slack
upstream:
  - mcp
  - rest
transport_strategy: "Official Slack MCP is preferred when the client/workspace supports it; this portable server uses the official Slack Web API as a deterministic fallback."
api_base_url: https://slack.com/api
auth:
  type: oauth2-token
  environment:
    - SLACK_BOT_TOKEN
    - SLACK_USER_TOKEN
scopes:
  read:
    - channels:read
    - groups:read
    - im:read
    - mpim:read
    - channels:history
    - groups:history
    - im:history
    - mpim:history
    - users:read
    - reactions:read
  write:
    - chat:write
    - reactions:write
capabilities:
  - conversation.list
  - conversation.history
  - thread.read
  - message.send
  - message.update
  - message.delete
  - user.get
  - user.list
  - reaction.get
  - reaction.add
risk:
  default: read
  approval_required:
    - slack.message.send
    - slack.message.update
    - slack.reaction.add
    - slack.message.delete
  destructive:
    - slack.message.delete

id: slack
name: Slack
version: 1.0.0
runtime:
  language: typescript
  node: ">=20"
upstream:
  - rest
api:
  base_url: https://slack.com/api
auth:
  type: oauth2-token
  credentials:
    - SLACK_BOT_TOKEN
    - SLACK_USER_TOKEN
  notes: "Use least-privilege Slack app OAuth tokens. A user token is only needed for message search."
capabilities:
  - auth.test
  - channel.list
  - channel.history
  - thread.replies
  - user.list
  - user.get
  - message.search
  - message.send
  - message.update
  - reaction.add
  - reaction.remove
  - channel.create
permissions:
  read:
    - slack.auth.test
    - slack.channel.list
    - slack.channel.history
    - slack.thread.replies
    - slack.user.list
    - slack.user.get
    - slack.message.search
  write:
    - slack.message.send
    - slack.message.update
    - slack.reaction.add
    - slack.reaction.remove
    - slack.channel.create
approval:
  default: required-for-write
risk:
  default: READ
  destructive_tools: []
environment:
  required_any_of:
    - SLACK_BOT_TOKEN
    - SLACK_USER_TOKEN
  optional:
    - SLACK_APPROVAL_MODE
    - SLACK_ALLOWED_CHANNEL_IDS
    - SLACK_REQUEST_TIMEOUT_MS
    - SLACK_MAX_RETRIES
security:
  credential_isolation: true
  retrieved_content_is_untrusted: true
  arbitrary_api_passthrough: false

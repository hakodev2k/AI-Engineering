id: resend
name: Resend
upstream: [rest, sdk]
api_base_url: https://api.resend.com
auth:
  type: api_key
  environment: RESEND_API_KEY
capabilities:
  - email.send
  - email.get
  - email.cancel
  - email.update
  - email.list
  - domain.list
  - domain.get
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - contact.delete
risk:
  default: read
  write_requires_approval: true
  destructive_requires_approval: true
environment:
  - RESEND_API_KEY
  - RESEND_TIMEOUT_MS
  - RESEND_MAX_RETRIES
  - RESEND_REQUIRE_WRITE_APPROVAL

id: resend
name: Resend
upstream:
  - mcp
  - rest
official_mcp:
  remote: https://mcp.resend.com/mcp
  local_package: resend-mcp
api_base_url: https://api.resend.com
auth:
  type: oauth2-or-api-key
  environment: RESEND_API_KEY
capabilities:
  - email.list
  - email.get
  - email.send
  - email.cancel
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - domain.list
  - domain.get
  - domain.verify
  - webhook.list
risk:
  default: READ
  write_requires_approval: true
  destructive_disabled_by_default: true
required_environment:
  - RESEND_API_KEY

id: resend
name: Resend
upstream:
  - official-mcp
  - rest
official_mcp:
  remote: https://mcp.resend.com/mcp
  local: resend-mcp
  auth: oauth2-or-bearer-api-key
rest:
  base_url: https://api.resend.com
auth:
  type: api-key
  env: RESEND_API_KEY
capabilities:
  - email.list
  - email.get
  - email.send
  - domain.list
  - domain.get
  - domain.verify
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - segment.list
  - segment.get
  - webhook.list
  - webhook.get
risk:
  default: READ
  write_approval: required
  destructive: disabled

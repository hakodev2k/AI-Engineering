id: resend
name: Resend
upstream:
  - mcp
mcp:
  endpoint: https://mcp.resend.com/mcp
  transport: streamable-http
  implementation: official
  source: https://github.com/resend/resend-mcp
auth:
  type: api-key
  header: Authorization
  scheme: Bearer
  required_env:
    - RESEND_API_KEY
capabilities:
  - email.list
  - email.get
  - email.send
  - email.cancel
  - received_email.list
  - received_email.get
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - contact.delete
  - domain.list
  - domain.get
risk:
  default: READ
  approval:
    WRITE: configurable
    HIGH_RISK: required
    DESTRUCTIVE: required
required_env:
  - RESEND_API_KEY
optional_env:
  - RESEND_UPSTREAM_MCP_URL
  - RESEND_APPROVAL_SECRET
  - RESEND_REQUIRE_WRITE_APPROVAL
  - RESEND_TIMEOUT_MS
  - RESEND_MAX_RETRIES
security:
  credentials_exposed_to_model: false
  upstream_tool_allowlist: true
  third_party_content_untrusted: true

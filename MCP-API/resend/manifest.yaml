id: resend
name: Resend
upstream:
  - mcp
  - rest
official_mcp:
  remote: https://mcp.resend.com/mcp
  local: resend-mcp
auth:
  types:
    - oauth2
    - api-key
  required_env:
    - RESEND_API_KEY
api_base_url: https://api.resend.com
capabilities:
  - email.list
  - email.get
  - domain.list
  - domain.get
  - contact.list
  - contact.get
  - segment.list
  - segment.get
  - webhook.list
  - webhook.get
  - email.send
  - contact.create
risk:
  default: READ
  write_approval: required
  destructive: disabled

id: openai
name: OpenAI
version: 1.0.0
runtime:
  language: javascript
  node: ">=22"

external_interface:
  protocol: mcp
  transport: stdio

upstream:
  - type: rest
    provider: OpenAI Platform API
    base_url: https://api.openai.com/v1
    official: true

mcp_strategy:
  official_provider_mcp_available: false
  note: >-
    No official general-purpose OpenAI Platform provider MCP server is used for these API operations.
    This package exposes a local MCP facade and calls the official OpenAI REST API directly.

credentials:
  isolation: connector-only
  auth:
    type: bearer-api-key
    environment_variable: OPENAI_API_KEY
  optional_headers:
    project: OPENAI_PROJECT
    organization: OPENAI_ORGANIZATION
  never_forward_to_model: true

environment:
  required:
    - OPENAI_API_KEY
  optional:
    - OPENAI_PROJECT
    - OPENAI_ORGANIZATION
    - OPENAI_ALLOWED_MODELS
    - OPENAI_APPROVAL_SECRET
    - OPENAI_REQUIRE_WRITE_APPROVAL
    - OPENAI_TIMEOUT_MS
    - OPENAI_MAX_READ_RETRIES
    - OPENAI_MAX_RETRY_DELAY_MS

capabilities:
  - model.list
  - model.get
  - response.create
  - response.get
  - response.cancel
  - moderation.create
  - embedding.create
  - vector_store.list
  - vector_store.get
  - vector_store.create
  - vector_store.search
  - file.list
  - file.get

permissions:
  provider: >-
    Use an OpenAI project API key with the narrowest project/key permissions that cover the enabled endpoints.
    This connector does not request or elevate provider permissions dynamically.
  model_allowlist: OPENAI_ALLOWED_MODELS

risk:
  default: read
  read:
    - openai.model.list
    - openai.model.get
    - openai.response.get
    - openai.moderation.create
    - openai.vector_store.list
    - openai.vector_store.get
    - openai.vector_store.search
    - openai.file.list
    - openai.file.get
  write:
    - openai.response.create
    - openai.embedding.create
    - openai.vector_store.create
  high_risk:
    - openai.response.cancel
  destructive: []

approval:
  write_default: required
  high_risk: required
  token:
    algorithm: HMAC-SHA256
    bound_to:
      - tool
      - canonical_arguments_hash
      - expiration
      - nonce
    max_lifetime_seconds: 300
    replay_protection: in-memory-single-use

reliability:
  timeout_ms_default: 30000
  read_retry_count_default: 2
  max_read_retry_count: 3
  honor_retry_after: true
  exponential_backoff_with_jitter: true
  no_blind_retry_for_writes: true
  no_retry_for_quota_or_billing_action_required: true
  pagination_bounded: true

security:
  arbitrary_http_tool: disabled
  arbitrary_openai_tool_execution: disabled
  response_builtin_tools: disabled
  response_function_tools: disabled
  credential_logging: disabled
  provider_content: untrusted_data
  fixed_api_host: api.openai.com
  vector_store_beta_header: assistants=v2

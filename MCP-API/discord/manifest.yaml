id: discord
name: Discord
upstream:
  - rest
api:
  base_url: https://discord.com/api/v10
auth:
  runtime: bot-token
  installation: oauth2-bot
  credential_env: DISCORD_BOT_TOKEN
capabilities:
  - guild.read
  - channel.list
  - channel.read
  - message.list
  - message.read
  - message.send
  - message.edit
  - message.delete
  - reaction.add
  - thread.create
risk:
  default: READ
  write_requires_approval: true
  destructive_requires_approval: true
approval:
  env: DISCORD_APPROVED_ACTION_IDS
security:
  guild_allowlist_env: DISCORD_ALLOWED_GUILD_IDS
  channel_allowlist_env: DISCORD_ALLOWED_CHANNEL_IDS
  credentials_exposed_to_llm: false
environment:
  required:
    - DISCORD_BOT_TOKEN
  optional:
    - DISCORD_API_BASE_URL
    - DISCORD_REQUEST_TIMEOUT_MS
    - DISCORD_MAX_RETRIES
    - DISCORD_ALLOWED_GUILD_IDS
    - DISCORD_ALLOWED_CHANNEL_IDS
    - DISCORD_APPROVED_ACTION_IDS

id: quo
name: Quo (formerly OpenPhone)
upstream: [rest]
api_base_url: https://api.openphone.com/v1
official_mcp: false
auth:
  type: api_key
  environment: QUO_API_KEY
capabilities:
  - phone_number.list
  - message.list
  - message.get
  - message.send
  - call.list
  - call.get
  - contact.list
  - contact.get
  - contact.create
  - contact.update
  - contact.delete
risk:
  default: READ
  write_approval_configurable: true
  destructive_approval_required: true
environment:
  - QUO_API_KEY
  - QUO_API_BASE_URL
  - QUO_TIMEOUT_MS
  - QUO_WRITE_APPROVAL_REQUIRED
  - QUO_ALLOW_DESTRUCTIVE

id: notion
name: Notion
upstream:
  - mcp
mcp:
  endpoint: https://mcp.notion.com/mcp
  transport: streamable-http
  auth: bearer-pat-or-oauth
capabilities:
  - workspace.read
  - search
  - content.read
  - comments.read
  - users.read
  - teams.read
  - pages.create
  - pages.update
  - comments.create
  - pages.move
  - pages.duplicate
  - databases.create
risk:
  default: read
  write_requires_approval: true
  high_risk_requires_approval: true
required_env:
  - NOTION_ACCESS_TOKEN
optional_env:
  - NOTION_MCP_URL
  - NOTION_APPROVAL_SECRET
  - NOTION_TIMEOUT_MS
rate_limits:
  general: "180 requests/minute average per user"
  search: "30 requests/minute"
security:
  upstream_tool_allowlist: true
  credentials_exposed_to_llm: false
  untrusted_provider_content: true

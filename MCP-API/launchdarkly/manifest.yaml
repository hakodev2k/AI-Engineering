id: launchdarkly
name: LaunchDarkly
upstream:
  - mcp: https://mcp.launchdarkly.com/mcp/launchdarkly
  - rest: https://app.launchdarkly.com/api/v2
auth:
  hosted_mcp: oauth2
  rest: personal-or-service-access-token
api_version: '20240415'
capabilities:
  - project.list
  - project.get
  - environment.list
  - flag.list
  - flag.get
  - flag.create
  - flag.update
  - flag.archive
  - flag.status
risk:
  default: READ
  write_approval: configurable
  high_risk_approval: required
environment:
  - LAUNCHDARKLY_ACCESS_TOKEN
  - LAUNCHDARKLY_API_VERSION
  - LAUNCHDARKLY_TIMEOUT_MS
  - LAUNCHDARKLY_APPROVE_WRITES
notes:
  - Hosted official MCP is preferred for interactive OAuth clients and supports feature management, AgentControl, and observability.
  - This reusable stdio bridge uses the official REST API so credentials remain connector-side and tool contracts stay deterministic.

id: launchdarkly
name: LaunchDarkly
upstream:
  - mcp
  - rest
official_mcp:
  hosted: https://mcp.launchdarkly.com/mcp/launchdarkly
  local_package: '@launchdarkly/mcp-server'
api:
  base_url: https://app.launchdarkly.com/api/v2
  version: '20240415'
auth:
  type: access_token
  env: LAUNCHDARKLY_ACCESS_TOKEN
  least_privilege: true
capabilities:
  - project.list
  - project.get
  - environment.list
  - flag.list
  - flag.get
  - flag.create
  - flag.update
  - flag.delete
  - segment.list
  - segment.get
  - segment.create
  - segment.update
  - segment.delete
risk:
  default: READ
  write_requires_config: true
  destructive_requires_explicit_approval: true
required_environment:
  - LAUNCHDARKLY_ACCESS_TOKEN

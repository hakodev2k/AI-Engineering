id: launchdarkly
name: LaunchDarkly
upstream:
  - mcp
  - rest
mcp:
  hosted_endpoint: https://mcp.launchdarkly.com/mcp/launchdarkly
  local_package: '@launchdarkly/mcp-server'
auth:
  hosted: oauth
  rest: access-token
api:
  base_url: https://app.launchdarkly.com/api/v2
  version: '20240415'
environment:
  - LAUNCHDARKLY_API_TOKEN
  - LAUNCHDARKLY_API_VERSION
  - LAUNCHDARKLY_TIMEOUT_MS
  - LAUNCHDARKLY_MAX_RETRIES
  - LAUNCHDARKLY_APPROVAL_MODE
capabilities:
  - project.list
  - project.get
  - environment.list
  - flag.list
  - flag.get
  - flag.create
  - flag.update
  - segment.list
  - segment.get
risk:
  default: read
  write_requires_approval: true
  destructive_enabled: false

id: launchdarkly
name: LaunchDarkly
runtime: node>=20
upstream:
  - mcp: https://mcp.launchdarkly.com/mcp/launchdarkly
  - rest: https://app.launchdarkly.com/api/v2
auth:
  hosted_mcp: oauth
  rest: personal_or_service_access_token
  least_privilege: true
env:
  required: [LAUNCHDARKLY_ACCESS_TOKEN]
  optional: [LAUNCHDARKLY_API_BASE, LAUNCHDARKLY_API_VERSION, LAUNCHDARKLY_TIMEOUT_MS, LAUNCHDARKLY_APPROVE_WRITES, LAUNCHDARKLY_APPROVE_HIGH_RISK]
capabilities:
  - project.list
  - project.get
  - environment.list
  - flag.list
  - flag.get
  - flag.create
  - flag.update
  - flag.toggle
  - segment.list
  - segment.get
  - audit.list
  - approval.list
risk:
  default: READ
  write_requires_configurable_approval: true
  high_risk_requires_explicit_approval: true
  destructive_enabled: false
security:
  credentials_exposed_to_llm: false
  provider_content_untrusted: true
  arbitrary_http: false

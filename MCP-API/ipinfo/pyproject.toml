[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "daily-mcp-ipinfo"
version = "1.0.0"
description = "Policy-controlled MCP adapter for the official IPinfo MCP server"
requires-python = ">=3.14"
dependencies = [
  "fastmcp>=3.0.0,<4",
  "ipinfo-mcp-server==0.1.12",
  "pydantic>=2.13.5,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[project.scripts]
ipinfo-connector = "ipinfo_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ipinfo_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

version: 1
slowdown_ratio_block: 2.0
absolute_latency_ms_block: 2000
min_baseline_samples: 5
max_candidate_variants: 12
max_retry_per_stage: 2
require_actual_plan_for_block: false
require_human_approval_for_query_hint: true
require_human_approval_for_index_change: true
require_human_approval_for_schema_change: true
allowed_mitigations:
  - query-shape-change
  - recompile-at-callsite
  - optimize-for-unknown-review
  - parameter-bucketing
forbidden_automatic_actions:
  - production-index-create
  - production-schema-change
  - force-plan
  - database-scoped-config-change

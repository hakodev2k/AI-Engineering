version: 1
name: agent-idempotency-retry-safety-gate
max_analysis_retries: 2
max_tool_retries: 2
risk_thresholds:
  low: 2
  medium: 5
  high: 8
signals:
  retry_keywords: [retry, retries, backoff, transient, resilience, polly]
  job_keywords: [hangfire, backgroundservice, worker, queue, consumer, handler, scheduler]
  side_effect_keywords: [insert, update, delete, send, publish, charge, payment, email, webhook, file, upload]
  idempotency_keywords: [idempotent, idempotency, dedup, duplicate, unique, correlation, requestid, messageid]
approval_required_for:
  - production-config-change
  - database-schema-change
  - destructive-data-change
  - breaking-api-contract
  - payment-behavior-change
  - message-redelivery-policy-change
verification:
  require_retry_path_test: true
  require_duplicate_delivery_test: true
  require_side_effect_inventory: true
  require_diff_review: true

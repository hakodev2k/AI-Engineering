version: 1
checkpoint:
  enabled: true
  interval_items: 100
  interval_seconds: 60
  storage: file
  path: .ai-checkpoints/background-job.json
  atomic_write: true
resume:
  require_job_identity_match: true
  require_input_fingerprint_match: true
  allow_stale_checkpoint: false
  max_checkpoint_age_hours: 24
retries:
  max_attempts: 3
  backoff_seconds: [5, 15, 45]
safety:
  require_approval_for_side_effect_replay: true
  reject_completed_checkpoint: true
  preserve_failed_checkpoint: true

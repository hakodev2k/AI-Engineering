version: 1
name: agent-ef-core-query-regression-investigator
max_hypothesis_attempts: 3
max_transient_retries: 2
slow_query_threshold_ms: 500
plan_regression_threshold_percent: 30
approval_required_for:
  - schema-change
  - production-index-change
  - query-hint
  - raw-sql-write
  - production-config-change
  - dependency-upgrade
verification:
  require_before_after_sql: true
  require_execution_plan_evidence: true
  require_behavioral_test: true
  require_diff_review: true
  require_remaining_risks: true
artifacts:
  investigation_report: artifacts/ef-query-investigation.md
  query_snapshot: artifacts/generated-sql.txt
  verification_report: artifacts/verification.md

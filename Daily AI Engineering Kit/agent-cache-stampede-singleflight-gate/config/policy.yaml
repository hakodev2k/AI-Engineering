version: 1
lock_timeout_ms: 5000
load_timeout_ms: 30000
stale_while_revalidate_seconds: 60
negative_cache_seconds: 10
max_waiters_per_key: 200
max_retries: 2
jitter_percent: 15
allow_stale_on_origin_failure: true
require_bounded_lock: true
require_request_coalescing: true
require_metrics: true
approval_required_for:
  - production_cache_flush
  - cache_cluster_reconfiguration
  - ttl_reduction_over_80_percent

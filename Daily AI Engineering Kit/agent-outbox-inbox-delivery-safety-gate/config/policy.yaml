version: 1
outbox:
  max_attempts: 5
  retry_backoff_seconds: [5, 30, 120, 600]
  require_idempotency_key: true
  require_created_at_utc: true
inbox:
  dedupe_ttl_hours: 72
  require_event_id: true
  require_source: true
verification:
  require_transactional_enqueue: true
  require_exactly_once_effect_semantics: true
  allow_at_least_once_transport: true
safety:
  production_replay_requires_approval: true
  destructive_repair_requires_approval: true

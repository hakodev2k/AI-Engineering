version: 1
environment: development
allow_read_only: true
allow_write_with_approval: false
block_production_writes: true
max_statements: 10
max_query_length: 20000
require_where_for:
  - update
  - delete
block_keywords:
  - drop
  - truncate
  - alter
  - grant
  - revoke
  - xp_cmdshell
  - copy
  - vacuum full
require_approval_keywords:
  - insert
  - update
  - delete
  - merge
  - create
forbid_comment_directives: true
allow_transactions: true
allowed_schemas: []
blocked_schemas:
  - information_schema
  - pg_catalog
  - sys
production_environment_names:
  - production
  - prod
  - live

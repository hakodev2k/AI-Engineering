version: 1
idempotency:
  header_candidates: ["Idempotency-Key", "X-Webhook-Id"]
  max_key_length: 200
  retention_seconds: 86400
  duplicate_http_status: 200
  processing_ttl_seconds: 300
  require_payload_hash: true
retries:
  max_verification_retries: 2
  retryable_exit_codes: [10]
safety:
  require_signature_verification: true
  reject_key_payload_mismatch: true
  require_atomic_claim: true
  approval_required_for:
    - production_configuration_change
    - schema_change
    - destructive_data_cleanup
    - weakening_signature_validation

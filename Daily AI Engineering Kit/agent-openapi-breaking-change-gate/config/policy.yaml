version: 1
spec_globs:
  - '**/openapi*.json'
  - '**/openapi*.yaml'
  - '**/openapi*.yml'
blocking_changes:
  - removed-path
  - removed-operation
  - removed-response-status
  - required-request-property-added
  - request-property-type-changed
  - response-property-type-changed
  - enum-value-removed
  - parameter-removed
  - parameter-made-required
non_blocking_changes:
  - description-changed
  - optional-request-property-added
  - response-property-added
max_retries: 1
require_human_approval_for_breaking_changes: true

version: 1
allowed_hash_algorithms:
  - sha256
require_manifest: true
require_build_commit_match: true
require_no_untracked_artifacts: true
require_signature_for_release: true
release_signature_approval_required: true
max_manifest_entries: 5000
artifact_roots:
  - artifacts
  - dist
  - publish
ignore_patterns:
  - '*.log'
  - '*.tmp'

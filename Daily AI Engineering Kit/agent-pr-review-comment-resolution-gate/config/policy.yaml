version: 1
max_retries: 2
require_tests_for_code_changes: true
require_diff_review: true
require_explicit_human_approval_for:
  - force-push
  - branch-history-rewrite
  - breaking-api-change
  - dependency-major-upgrade
  - production-config-change
comment_statuses:
  - open
  - needs-change
  - resolved
  - blocked
  - rejected-with-evidence

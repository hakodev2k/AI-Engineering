version: 1
package_name: agent-dependency-upgrade-canary-gate
max_retries: 2
risk:
  approval_required_for:
    - major-version
    - security-sensitive
    - runtime-framework
    - database-provider
    - auth-library
    - build-toolchain
    - more-than-5-direct-dependencies
  blocked_without_explicit_scope:
    - transitive-mass-update
    - lockfile-regeneration-unrelated-to-target
verification:
  require_clean_git_start: true
  require_baseline_capture: true
  require_lockfile_delta: true
  require_build: true
  require_tests: true
  require_diff_review: true
  require_independent_verifier: true
  default_commands:
    dotnet:
      build: dotnet build --nologo
      test: dotnet test --nologo --no-restore
    npm:
      build: npm run build --if-present
      test: npm test -- --runInBand
    python:
      build: python -m compileall .
      test: python -m pytest -q
allowed_statuses:
  - planned
  - baseline-captured
  - upgraded
  - verified
  - blocked
  - needs-approval
  - failed
outputs:
  state_dir: .ai/dependency-upgrade-canary
  baseline_file: baseline.json
  verification_file: verification.json

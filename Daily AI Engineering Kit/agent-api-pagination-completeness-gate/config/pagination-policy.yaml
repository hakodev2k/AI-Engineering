version: 1
max_pages: 500
max_items: 100000
max_retries_per_page: 2
request_timeout_seconds: 30
require_stable_ordering: true
require_duplicate_detection: true
require_loop_detection: true
accepted_modes:
  - link
  - cursor
  - page-number
  - offset
completion_statuses:
  - verified-complete
  - partial
  - blocked

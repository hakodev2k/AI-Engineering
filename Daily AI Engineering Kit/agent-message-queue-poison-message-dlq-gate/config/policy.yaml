version: 1
max_delivery_attempts: 5
retry_delays_seconds: [5, 30, 120, 600]
max_message_age_seconds: 86400
require_message_id: true
require_correlation_id: true
require_schema_version: true
redact_payload_fields: [password, token, secret, authorization]
dlq_name_suffix: .dlq
allow_automatic_replay: false
max_replay_batch: 100
require_human_approval_for_replay: true

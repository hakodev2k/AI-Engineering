version: 1
name: agent-async-cancellation-propagation-gate
max_fix_retries: 2
scan_extensions:
  - .cs
  - .fs
  - .vb
  - .ts
  - .js
risk_patterns:
  missing_token_parameter: true
  token_not_forwarded: true
  swallowed_operation_canceled_exception: true
  cancellationtoken_none_in_request_path: true
  unbounded_delay_without_token: true
  blocking_wait_in_async_path: true
approval_required_for:
  - public-api-contract-change
  - production-config-change
  - database-schema-change
  - dependency-major-upgrade
  - security-control-change
verification:
  require_static_scan: true
  require_targeted_tests: true
  require_diff_review: true
  require_independent_verifier: true
status_values:
  - pass
  - fail
  - needs-approval
  - blocked

version: 1
name: agent-test-flake-triage-loop
retry_policy:
  reproduction_attempts: 5
  post_fix_attempts: 10
  tool_retries: 2
classification:
  categories:
    - timing
    - concurrency
    - shared-state
    - ordering
    - external-dependency
    - resource-exhaustion
    - nondeterministic-data
    - environment
    - unknown
safety:
  forbid_test_disabling: true
  forbid_assertion_weakening_without_approval: true
  forbid_retry_only_fixes: true
  require_human_approval_for:
    - production-config-change
    - dependency-major-upgrade
    - destructive-data-change
    - test-quarantine
verification:
  require_original_failure_evidence: true
  require_post_fix_repetition: true
  require_diff_review: true
  require_remaining_risk: true
artifacts:
  evidence_dir: .ai/flake-triage/evidence
  report_path: .ai/flake-triage/report.md

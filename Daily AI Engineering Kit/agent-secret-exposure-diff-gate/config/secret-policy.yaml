version: 1
scan_scope: staged-and-working-tree
max_file_bytes: 1048576
allow_binary: false
entropy_threshold: 4.2
min_entropy_length: 20
fail_on_severity:
  - high
  - critical
patterns:
  - id: generic-api-key
    severity: high
    regex: '(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["'"']?[A-Za-z0-9_\-\/+=]{16,}'
  - id: aws-access-key
    severity: critical
    regex: 'AKIA[0-9A-Z]{16}'
  - id: github-token
    severity: critical
    regex: 'gh[pousr]_[A-Za-z0-9]{30,}'
  - id: private-key
    severity: critical
    regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
ignore_paths:
  - '.git/**'
  - 'node_modules/**'
  - 'bin/**'
  - 'obj/**'
  - 'dist/**'
  - 'coverage/**'
allowlist_file: '.secret-scan-allowlist.json'

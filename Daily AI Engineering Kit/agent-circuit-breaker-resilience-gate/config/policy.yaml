version: 1
operation_timeout_seconds: 15
max_attempts_per_call: 2
consecutive_failures_to_open: 3
failure_rate_window: 10
failure_rate_threshold: 0.6
open_seconds: 30
half_open_probe_limit: 1
retryable_status_codes: [408, 425, 429, 500, 502, 503, 504]
non_retryable_status_codes: [400, 401, 403, 404, 409, 422]
retryable_error_kinds:
  - timeout
  - connection-reset
  - dns-temporary
  - rate-limit
  - upstream-5xx
max_retry_after_seconds: 60
jitter_ratio: 0.2
base_backoff_seconds: 1
max_backoff_seconds: 8
require_idempotency_for_retries: true
approval_required_for:
  - disabling-circuit-breaker
  - increasing-attempt-budget
  - increasing-timeout
  - bypassing-idempotency-check
  - production-policy-change

version: 1
topic: agent-distributed-lock-lease-safety-gate
lease:
  max_duration_seconds: 120
  renewal_fraction: 0.5
  max_renewals: 3
  acquire_timeout_seconds: 10
  require_owner_token: true
  require_fencing_token_for_shared_state: true
retries:
  acquire: 2
  transient_tool: 2
verification:
  require_contention_test: true
  require_expiry_test: true
  require_stale_owner_test: true
approval:
  production_lock_changes: true
  lock_backend_changes: true
  destructive_recovery: true

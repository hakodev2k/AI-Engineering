topic: agent-pagination-cursor-consistency-gate
version: 1
max_retries: 2
scan:
  include: ['**/*.cs','**/*.ts','**/*.js','**/*.py','**/*.sql']
  exclude: ['**/bin/**','**/obj/**','**/node_modules/**','**/dist/**']
policy:
  require_stable_order: true
  require_unique_tiebreaker: true
  forbid_offset_for_mutating_feeds: true
  require_cursor_validation: true
  require_bounded_page_size: true
  max_page_size: 500
  require_forward_progress: true
approval:
  required_for: ['breaking-api-contract','database-schema-change','production-config-change']

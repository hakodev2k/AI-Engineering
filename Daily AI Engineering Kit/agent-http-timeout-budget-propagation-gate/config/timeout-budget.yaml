version: 1
name: agent-http-timeout-budget-propagation-gate
default_request_budget_ms: 30000
minimum_reserve_ms: 250
max_fix_retries: 2
max_tool_retries: 2
risk_thresholds:
  warn_score: 3
  block_score: 6
weights:
  hardcoded_timeout_without_budget: 3
  child_timeout_exceeds_parent: 4
  retry_without_deadline: 4
  blocking_wait_in_async_path: 3
  missing_cancellation: 3
  nested_retry_layers: 3
  infinite_timeout: 5
  swallowed_timeout_or_cancellation: 5
approval_required_for:
  - production-config-change
  - infrastructure-timeout-change
  - breaking-api-contract
  - database-schema-change
  - security-control-change
  - large-dependency-upgrade
statuses:
  - pass
  - warn
  - block
  - needs-approval
  - insufficient-evidence
verification:
  require_parent_budget: true
  require_child_budget_evidence: true
  require_retry_deadline_evidence: true
  require_test_evidence_for_blocking_findings: true
  require_unresolved_risks: true

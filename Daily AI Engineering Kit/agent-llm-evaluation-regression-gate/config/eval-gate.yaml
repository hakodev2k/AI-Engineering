version: 1
baseline: evals/baseline.jsonl
candidate: evals/candidate.jsonl
thresholds:
  min_pass_rate: 0.95
  max_pass_rate_drop: 0.02
  max_mean_score_drop: 0.03
  max_p95_latency_increase_pct: 20
  max_mean_cost_increase_pct: 15
  max_critical_regressions: 0
weights:
  correctness: 0.55
  safety: 0.25
  format: 0.10
  tool_use: 0.10
required_dimensions:
  - correctness
  - safety
approval_required_for:
  - baseline_replacement
  - threshold_weakening
  - evaluator_change
  - production_model_change

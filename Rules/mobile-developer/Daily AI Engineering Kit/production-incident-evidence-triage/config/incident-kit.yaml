version: 1
name: production-incident-evidence-triage
max_hypothesis_retries: 2
max_tool_retries: 2
required_evidence_fields:
  - source
  - observed_at
  - finding
  - confidence
approval_required_for:
  - production-deployment
  - destructive-sql
  - schema-change
  - secret-change
  - production-config-change
  - data-deletion
  - force-push
allowed_statuses:
  - investigating
  - mitigated
  - resolved
  - blocked
  - needs-approval
verification:
  require_reproduction_or_equivalent_signal: true
  require_root_cause_evidence: true
  require_post_change_validation: true
  require_unresolved_risks: true

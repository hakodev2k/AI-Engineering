version: 1
preferred_locator_order:
  - getByRole
  - getByLabel
  - getByPlaceholder
  - getByText
  - getByTestId
  - css
forbidden_patterns:
  - nth-child
  - generated-class-chain
  - absolute-xpath
  - hashed-css-class
max_repair_attempts: 2
require_before_after_evidence: true
require_targeted_retest: true
require_full_spec_retest: true
approval_required_for:
  - production-test-data-write
  - destructive-test-cleanup
  - disabling-security-check
  - weakening-assertion-to-pass
  - deleting-failing-test
status_values:
  - investigating
  - candidate-found
  - repaired
  - verified
  - blocked
  - needs-approval

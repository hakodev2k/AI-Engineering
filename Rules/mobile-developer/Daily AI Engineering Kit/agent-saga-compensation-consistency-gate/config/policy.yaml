version: 1
max_steps: 20
max_compensation_attempts: 3
require_idempotency_key: true
require_compensation_for_side_effects: true
require_compensation_order: reverse
require_evidence_for_non_compensable: true
require_human_approval_for:
  - destructive-compensation
  - irreversible-step
  - production-data-repair
  - manual-balance-adjustment
allowed_statuses:
  - planned
  - executing
  - compensating
  - compensated
  - completed
  - blocked
  - failed

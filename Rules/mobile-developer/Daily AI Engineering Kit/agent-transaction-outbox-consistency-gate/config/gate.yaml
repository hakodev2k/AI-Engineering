topic: agent-transaction-outbox-consistency-gate
version: 1
status_values: [pending, approved, blocked, failed, verified]
max_retries: 2
outbox:
  required_columns: [id, occurred_at, event_type, payload, status]
  recommended_columns: [aggregate_id, attempts, next_attempt_at, processed_at, last_error]
  terminal_statuses: [processed, dead_letter]
  pending_statuses: [pending, retry]
checks:
  require_atomic_business_and_outbox_write: true
  require_stable_message_id: true
  require_consumer_idempotency: true
  require_bounded_retry: true
  require_dead_letter_or_quarantine: true
  forbid_publish_before_commit: true
  forbid_mark_processed_before_publish_ack: true
approval_required:
  - database-schema-change
  - production-configuration-change
  - destructive-sql
  - production-deployment
  - breaking-event-contract
  - secret-change

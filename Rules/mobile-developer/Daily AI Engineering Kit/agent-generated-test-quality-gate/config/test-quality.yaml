version: 1
package: agent-generated-test-quality-gate
quality:
  minimum_assertions_per_test_file: 1
  maximum_snapshot_ratio: 0.5
  require_failure_message_or_named_assertion: false
  require_changed-code-test-link: true
  require_negative_or_boundary_case_for_logic_change: true
  require_deterministic_tests: true
  forbid_disabled_tests: true
  forbid_only_focused_tests: true
risk:
  high_risk_paths:
    - src/**/Auth/**
    - src/**/Security/**
    - src/**/Payments/**
    - src/**/Migrations/**
  approval_required_for:
    - production-config-change
    - security-control-change
    - destructive-data-change
    - breaking-api-contract
retries:
  test_fix_retries: 2
  verification_retries: 1
commands:
  default_test: dotnet test --no-restore
  optional_coverage: dotnet test --collect:"XPlat Code Coverage"

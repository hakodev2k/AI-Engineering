version: 1
name: agent-observability-signal-correlation-triage
window_minutes: 30
max_retries: 2
minimum_sources: 2
confidence_threshold: 0.70
required_signal_types:
  - logs
optional_signal_types:
  - metrics
  - traces
  - deployments
  - alerts
approval_required_for:
  - production-change
  - production-restart
  - secret-change
  - destructive-query
  - traffic-shift
  - rollback
redaction_patterns:
  - '(?i)authorization:\s*bearer\s+\S+'
  - '(?i)(password|passwd|secret|api[_-]?key)\s*[:=]\s*\S+'

version: 1
name: agent-lock-contention-regression-gate
max_fix_retries: 2
risk_thresholds:
  medium: 3
  high: 6
patterns:
  lock_tokens:
    - "lock ("
    - "Monitor.Enter"
    - "SemaphoreSlim"
    - "Mutex"
    - "ReaderWriterLockSlim"
  blocking_tokens:
    - ".Result"
    - ".Wait()"
    - "Thread.Sleep"
  io_tokens:
    - "HttpClient"
    - "SendAsync"
    - "SaveChanges"
    - "ExecuteSql"
    - "ReadAsync"
    - "WriteAsync"
approval_required_for:
  - production-config-change
  - database-schema-change
  - destructive-sql
  - weakening-concurrency-safety
  - replacing-locking-with-unsafe-lock-free-code
verification:
  require_before_after_evidence: true
  require_contention_test_or_equivalent_signal: true
  require_diff_review: true
  require_independent_verifier: true

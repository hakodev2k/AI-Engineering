version: 1
scan_globs:
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/*.spec.js"
  - "**/*.test.js"
exclude_globs:
  - "examples/**"
block_patterns:
  - "nth-child("
  - ":nth-of-type("
  - "xpath="
  - "locator('//*"
warn_patterns:
  - ".nth("
  - "getByText("
  - "locator('text="
  - "locator(\"text="
max_warnings_per_file: 5
require_assertion_after_action: true
allow_test_ids: true
preferred_locators:
  - "getByRole"
  - "getByLabel"
  - "getByPlaceholder"
  - "getByTestId"
  - "getByAltText"
  - "getByTitle"

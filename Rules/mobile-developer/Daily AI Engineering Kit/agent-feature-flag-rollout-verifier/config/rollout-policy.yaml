version: 1
name: agent-feature-flag-rollout-verifier
max_retries: 2
risk_levels:
  low:
    max_initial_percent: 25
  medium:
    max_initial_percent: 10
  high:
    max_initial_percent: 5
approval_required_for:
  - production-flag-enable
  - rollout-above-25-percent
  - irreversible-data-path
  - security-sensitive-path
  - breaking-contract-path
required_checks:
  - baseline-captured
  - flag-off-path-verified
  - flag-on-path-verified
  - rollback-path-verified
  - telemetry-query-defined
  - acceptance-thresholds-defined
allowed_statuses:
  - planned
  - ready
  - blocked
  - needs-approval
  - canary
  - expanding
  - rolled-back
  - verified

version: 1
engine: auto
thresholds:
  max_cost_ratio: 1.30
  max_row_ratio: 2.0
  forbid_new_seq_scan: true
retry:
  transient_capture: 2
  fix_cycles: 2
approval_required:
  - production_executing_diagnostics
  - index_or_schema_change
  - migration
  - database_configuration_change
  - destructive_sql
  - production_deployment
notes:
  - CLI flags are the executable source of thresholds; keep CI flags aligned with this file.
  - Compare plans only under representative and materially equivalent conditions.

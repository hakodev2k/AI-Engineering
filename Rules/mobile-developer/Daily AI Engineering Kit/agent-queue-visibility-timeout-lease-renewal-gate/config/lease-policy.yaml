version: 1
lease:
  visibility_timeout_seconds: 60
  renew_before_seconds: 20
  max_total_lease_seconds: 900
  max_renewals: 20
  heartbeat_interval_seconds: 15
  ownership_token_required: true
processing:
  max_parallel_messages: 8
  require_idempotency_key: true
  abandon_on_handler_failure: true
  dead_letter_after_delivery_count: 5
recovery:
  transient_retry_limit: 3
  transient_retry_backoff_seconds: [2, 5, 10]
  stop_on_lease_lost: true
approval:
  required_for_queue_purge: true
  required_for_dead_letter_replay: true

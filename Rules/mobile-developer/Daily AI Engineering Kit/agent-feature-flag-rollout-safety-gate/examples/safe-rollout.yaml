flag_key: checkout.new-pricing
owner: commerce-platform
service: checkout-api
environment: staging
expires_on: 2026-10-15
kill_switch: true
risk_summary: Incorrect price calculation or increased checkout latency.
rollback:
  trigger: Error-rate or latency threshold breach, pricing mismatch, or critical checkout incident.
  action: Disable checkout.new-pricing and verify the legacy pricing path is serving requests.
observability:
  metrics:
    - name: error_rate
      abort_threshold: "greater than 1% for 5 minutes in exposed traffic"
    - name: latency
      abort_threshold: "p95 greater than 500 ms for 5 minutes in exposed traffic"
stages:
  - name: canary
    target_type: percentage
    percentage: 5
    duration_minutes: 15
    success_criteria: No pricing mismatch and both required metrics remain below thresholds.
  - name: expanded
    target_type: percentage
    percentage: 25
    duration_minutes: 30
    success_criteria: Metrics remain healthy and checkout conversion does not materially regress.
  - name: majority
    target_type: percentage
    percentage: 75
    duration_minutes: 60
    success_criteria: Metrics and business validation remain healthy with no fallback errors.

id: paypal
name: PayPal

upstream:
  - type: mcp
    implementation: official
    local_package: "@paypal/mcp"
    sandbox_endpoint: "https://mcp.sandbox.paypal.com/http"
    production_endpoint: "https://mcp.paypal.com/http"
  - type: rest
    purpose: oauth2-token-acquisition
    sandbox_base_url: "https://api-m.sandbox.paypal.com"
    production_base_url: "https://api-m.paypal.com"

auth:
  type: oauth2-client-credentials
  token_endpoint: "/v1/oauth2/token"
  credentials:
    - PAYPAL_CLIENT_ID
    - PAYPAL_CLIENT_SECRET
  model_visible_credentials: false

capabilities:
  - invoice.list
  - invoice.get
  - invoice.create
  - invoice.send
  - invoice.remind
  - invoice.cancel
  - order.create
  - order.get
  - order.capture
  - refund.create
  - refund.get
  - dispute.list
  - dispute.get
  - dispute.accept

risk:
  default: read
  write_requires_approval_by_default: true
  high_risk_requires_approval: true
  destructive_enabled: false
  sandbox_default: true
  production_requires: PAYPAL_LIVE_MODE_ALLOWED=true

approval:
  secret_env: PAYPAL_APPROVAL_SECRET
  algorithm: hmac-sha256
  binding: tool-and-operation-payload-hash
  max_ttl_seconds: 300

environment:
  required:
    - PAYPAL_CLIENT_ID
    - PAYPAL_CLIENT_SECRET
  optional:
    - PAYPAL_ENVIRONMENT
    - PAYPAL_LIVE_MODE_ALLOWED
    - PAYPAL_REQUIRE_WRITE_APPROVAL
    - PAYPAL_APPROVAL_SECRET
    - PAYPAL_TIMEOUT_MS

security:
  fixed_upstream_tool_allowlist: true
  arbitrary_api_proxy: false
  provider_content_untrusted: true
  credential_isolation: true
  bounded_read_retry: true
  automatic_high_risk_retry: false

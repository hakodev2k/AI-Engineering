id: datadog
name: Datadog
upstream:
  - official-mcp
  - rest
mcp:
  official_url: https://mcp.datadoghq.com/v1/mcp
  auth: oauth2
  status: managed
  strategy: "Datadog provides an official managed MCP server with OAuth, toolsets, and resource permissions. This connector intentionally exposes a narrower audited REST-backed tool contract and does not auto-discover or proxy upstream tools."
api:
  base_url: https://api.datadoghq.com
auth:
  type: api_key_plus_application_key
  required_env:
    - DATADOG_API_KEY
    - DATADOG_APPLICATION_KEY
  least_privilege_scopes:
    - monitors_read
    - monitors_write
    - dashboards_read
    - incident_read
    - timeseries_query
capabilities:
  - auth.validate
  - monitor.list
  - monitor.get
  - monitor.create
  - monitor.update
  - monitor.delete
  - dashboard.list
  - dashboard.get
  - incident.list
  - incident.get
  - metric.query
  - event.list
risk:
  default: READ
  writes_require_operator_approval: true
  destructive_disabled_by_default: true
required_env:
  - DATADOG_API_KEY
  - DATADOG_APPLICATION_KEY
optional_env:
  - DATADOG_API_BASE_URL
  - DATADOG_TIMEOUT_MS
  - DATADOG_APPROVAL_MODE
  - DATADOG_APPROVED_ACTIONS
  - DATADOG_ALLOW_DESTRUCTIVE

role: accessibility-engineer
version: 1
source_of_truth: accessibility-work-item
priorities:
  - production-critical-barrier
  - critical-journey-release-blocker
  - high-severity-user-barrier
  - dependency-blocking-accessibility-work
  - medium-and-low-remediation
  - systemic-prevention-and-tooling
retry_policy:
  remediation_retest_max: 2
human_approval_required_for:
  - unresolved-critical-or-high-release-risk
  - reduced-audit-scope
  - accessibility-or-compliance-exception
  - destructive-test-action
quality_gates:
  require_reproducible_evidence: true
  require_manual_testing_for_interactive_ui: true
  automation_alone_is_sufficient: false
  prefer_native_semantics: true
concurrency:
  parallel_reviews:
    - semantic
    - interaction
    - assistive-technology
  final_owner: accessibility-engineer

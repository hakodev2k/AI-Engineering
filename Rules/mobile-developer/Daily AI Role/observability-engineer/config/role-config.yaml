role: observability-engineer
max_retries: 2
priority_order:
  - active_incident_blind_spot
  - critical_journey_gap
  - pipeline_or_alert_failure
  - release_blocker
  - recurring_investigation_friction
  - planned_improvement
human_approval:
  sensitive_data_collection: true
  destructive_telemetry_change: true
  org_wide_retention_change: true
  critical_alert_disable: true
quality:
  require_owner: true
  require_cardinality_review: true
  require_cost_review: true
  require_evidence: true

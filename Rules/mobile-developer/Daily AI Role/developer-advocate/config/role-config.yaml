role: developer-advocate
max_review_retries: 2
freshness_days_default: 90
priority_order:
  - public-correctness-or-security
  - launch-blocker
  - deadline-bound-release-or-event
  - repeated-developer-friction
  - planned-enablement
  - maintenance
approval_roles:
  product_claim: product-owner
  technical_ambiguity: engineering-owner
  security_privacy: security-owner
  public_legal: legal-or-comms-owner
  irreversible_publication: accountable-owner

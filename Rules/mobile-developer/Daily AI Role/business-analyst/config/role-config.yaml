role: business-analyst
status_values:
  - draft
  - discovery
  - review-required
  - blocked
  - pending-approval
  - approved
  - superseded
  - complete
priority_weights:
  business_impact: 0.25
  severity_or_compliance: 0.20
  deadline: 0.15
  dependency_unblock: 0.15
  reversibility: 0.10
  uncertainty_reduction: 0.10
  effort_efficiency: 0.05
review:
  max_repair_cycles: 2
  require_independent_acceptance_review: true
human_approval:
  required_for:
    - financial_or_contractual_commitment
    - legal_or_compliance_policy
    - privacy_or_security_policy
    - irreversible_data_behavior
    - external_commitment
    - material_scope_baseline_change

role: database-engineer
final_owner: database-engineer
priority:
  p0: active-data-loss-corruption-or-database-unavailable
  p1: severe-production-degradation-or-high-risk-release-blocker
  p2: material-performance-capacity-or-migration-risk
  p3: routine-design-maintenance-and-toil
retry:
  max_transient_attempts: 2
  ambiguous_write_retry: false
approval_required_for:
  - destructive-ddl-or-dml
  - production-data-repair
  - forced-failover
  - durability-reduction
  - known-data-loss
  - high-or-critical-residual-risk
  - safety-constraint-bypass
verification:
  independent_for_high_risk: true
  require_before_after_for_performance: true
concurrency:
  parallel_read_only_investigation: true
  serialize_shared-schema-or-topology-changes: true
secrets:
  hardcode: false

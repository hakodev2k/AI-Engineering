role: ux-designer
retry_limit: 2
priority_order:
  - user_business_impact
  - safety_security_privacy_accessibility
  - deadline_dependency
  - reversibility_uncertainty
  - effort_cost
approval_gates:
  - sensitive_research_data
  - legal_or_privacy_interpretation
  - irreversible_production_change
  - public_commitment
  - paid_research_spend
  - critical_risk_acceptance
parallel_reviews:
  - research_evidence
  - accessibility
  - interaction_consistency
  - usability_risk

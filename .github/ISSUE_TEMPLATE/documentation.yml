name: Documentation improvement
description: Report unclear, missing, inconsistent, or outdated documentation.
title: "[Docs]: "
body:
  - type: input
    id: page
    attributes:
      label: Document or path
      placeholder: docs/GETTING_STARTED.md
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Missing information
        - Incorrect or outdated information
        - Unclear instructions
        - Broken navigation or link
        - Standalone adoption or missing dependency
        - Inconsistent terminology
        - Accessibility or formatting
    validations:
      required: true
  - type: textarea
    id: current_problem
    attributes:
      label: Current problem
      description: Explain what a reader cannot understand or complete.
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Suggested improvement
      description: Describe the content or structure that would resolve the problem.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I checked the documentation hub and existing issues.
          required: true
        - label: I removed private or sensitive information.
          required: true
